<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiFi Tools & Games - Google Play</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 20px;
    }
    h2 { margin-bottom: 8px; font-size: 22px; }
    p { color: #94a3b8; margin-bottom: 24px; font-size: 15px; }
    .btn {
      background: #10b981;
      color: #0b0f19;
      font-weight: 700;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 16px;
      display: inline-block;
    }
  </style>
  <script>
    const PACKAGE_ID = "com.luckydeveloper.apkshare"; // e.g. com.example.wifitools
    const playStoreWebUrl = `https://play.google.com/store/apps/details?id=${PACKAGE_ID}`;
    
    // Special Android Chrome/WebView intent that forces the native Google Play Store app to open
    const androidIntentUrl = `intent://details?id=${PACKAGE_ID}#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=${encodeURIComponent(playStoreWebUrl)};end`;

    window.onload = function() {
      const isAndroid = /Android/i.test(navigator.userAgent);
      const targetUrl = isAndroid ? androidIntentUrl : playStoreWebUrl;

      // Update the fallback button link
      document.getElementById("download-btn").href = targetUrl;

      // Automatically trigger the redirect after 150ms
      setTimeout(() => {
        window.location.replace(targetUrl);
      }, 150);
    };
  </script>
</head>
<body>
  <h2>WiFi Tools & Games</h2>
  <p>Opening Google Play Store...</p>
  <a id="download-btn" class="btn" href="https://play.google.com/store/apps/details?id=YOUR_PACKAGE_ID_HERE">
    Open in Google Play
  </a>
</body>
</html>
